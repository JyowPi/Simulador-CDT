<?xml version="1.0" encoding="UTF-8" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core">

<h:head>

	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

	<title> CDT</title>



</h:head>

<h:body>

	<h1>#{pru.mensaje()}</h1>
	<div class="card">

		<p:tabMenu>

			<p:menuitem value="Inicio" outcome="/index" icon="pi pi-fw pi-home" />

			<p:menuitem value="Lista CDT" outcome="/cdt" icon="pi pi-fw pi-home" />
			
			<p:menuitem value="CDT" outcome="/cdtPersona" icon="pi pi-fw pi-home" />


		</p:tabMenu>
	</div>
	
	
<h:form>

		<div class="card">

			<p:panel header="Señor(a) Usuario(a)">


				<br/>

				<p:outputLabel value="Nombre: " />

				<h:outputText value="#{cdtBean.objService.objPersona.nombre}" />

				<br/>

				<p:outputLabel value="Apellido: " />

				<h:outputText value="#{cdtBean.objService.objPersona.apellido}" />

				<br/>

				<p:outputLabel value="Correo: " />

				<h:outputText value="#{cdtBean.objService.objPersona.correo}" />

				<br/>

				<p:outputLabel value="Telefono: " />

				<h:outputText value="#{cdtBean.objService.objPersona.telefono}" />
				
				<br/>

				<p:outputLabel value="Plazo en dias: " />

				<h:outputText value="#{cdtBean.objService.cdt.numeroDias}" />
				
				<br/>

				<p:outputLabel value="Monto Invertido: " />

				<h:outputText value="#{cdtBean.objService.cdt.valorAinvertir}" />
				
				<br/>

				<p:outputLabel value="Tasa de interes anual: " />

				<h:outputText value="#{cdtBean.objService.cdt.tasaInteresAnual} %" />
				
				<br/>

				<p:outputLabel value="Tasa Efectiva anual: " />

				<h:outputText value="#{cdtBean.objService.cdt.tasaEfectivaAnual} %" />
				
				<br/>

				<p:outputLabel value="Rentabilidad generada por periodo: " />

				<h:outputText value="#{cdtBean.objService.cdt.rentabilidadPorPeriodo}" />
				
				<br/>

				<p:outputLabel value="Rentabilidad Netal: " />

				<h:outputText value="#{cdtBean.objService.cdt.rentabilidadNeta}" />
				
				<br/>

				<p:outputLabel value="Retencion en la fuente: " />

				<h:outputText value="#{cdtBean.objService.cdt.reteFuente}" />
				
				<br/>

				<p:outputLabel value="Margen de ganancia bruta: " />

				<h:outputText value="#{cdtBean.objService.cdt.gananciaBruta}" />
				
				<br/>

				<p:outputLabel value="Monto de ganancia final: " />

				<h:outputText value="#{cdtBean.objService.cdt.montoFinal}" />


			</p:panel>

		</div>

	</h:form>

		

</h:body>

</html>
