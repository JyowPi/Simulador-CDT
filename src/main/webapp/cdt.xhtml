<?xml version="1.0" encoding="UTF-8" ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:p="http://primefaces.org/ui" xmlns:f="jakarta.faces.core">

<h:head>

	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

	<title>Registro CDT</title>



</h:head>

<h:body>

	<h1>#{pru.mensaje()}</h1>

	<div class="card">

		<p:tabMenu>

			<p:menuitem value="Inicio" outcome="/index" icon="pi pi-fw pi-home" />

			<p:menuitem value="Lista CDT" outcome="/cdt" icon="pi pi-fw pi-home" />
			
			<p:menuitem value="CDT" outcome="/cdtPersona" icon="pi pi-fw pi-home" />


		</p:tabMenu>
	</div>


<h:form>

		<h:commandButton value="Recargar" action="#{cdtBean.cargar()}" />

	</h:form>
	<p:dataTable var="r" value="#{cdtBean.registros}">
		


		<p:column headerText="Nombre">

			<h:outputText value="#{r.Persona.nombre}" />

		</p:column>


		<p:column headerText="Apellido">

			<h:outputText value="#{r.Persona.apellido}" />

		</p:column>


		<p:column headerText="Correo">

			<h:outputText value="#{r.Persona.correo}" />

		</p:column>
		
		<p:column headerText="Telefono">

			<h:outputText value="#{r.Persona.telefono}" />

		</p:column>
		
		<p:column headerText="Monto invertido">

			<h:outputText value="#{r.CDT.valorAinvertir}" />

		</p:column>
		
		<p:column headerText="Ganancia Generada">

			<h:outputText value="#{r.CDT.montoFinal}" />

		</p:column>



	</p:dataTable>

</h:body>

</html>
